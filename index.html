<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GayPhim</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Roboto:wght@400;700;900&family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Nunito:wght@700;800;900&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="assets/images/favicon.jpg?v=4">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css?v=37">
</head>

<body>
    <!-- Navbar -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo"><img src="assets/images/cute_logo_v2_transparent.png" alt="Gay Phim Logo"></a>

            <div class="nav-menu">
                <a href="index.html?country=han-quoc" class="k-drama-btn">K-Drama <i class="fas fa-heart"></i></a>
                <div class="dropdown">
                    <button class="dropbtn">Thể loại <i class="fas fa-chevron-down"></i></button>
                    <div class="dropdown-content">
                        <a href="index.html?category=phim-bo">Phim Bộ</a>
                        <a href="index.html?category=phim-le">Phim Lẻ</a>
                        <a href="index.html?category=hoat-hinh">Hoạt Hình</a>
                        <a href="index.html?category=hanh-dong">Hành Động</a>
                        <a href="index.html?category=tinh-cam">Tình Cảm</a>
                        <a href="index.html?category=co-trang">Cổ Trang</a>
                        <a href="index.html?category=chien-tranh">Chiến Tranh</a>
                        <a href="index.html?category=vien-tuong">Viễn Tưởng</a>
                        <a href="index.html?category=kinh-di">Kinh Dị</a>
                        <a href="index.html?category=tam-ly">Tâm Lý</a>
                        <a href="index.html?category=hai-huoc">Hài Hước</a>
                        <a href="index.html?category=vo-thuat">Võ Thuật</a>
                        <a href="index.html?category=khoa-hoc">Khoa Học</a>
                        <a href="index.html?category=than-thoai">Thần Thoại</a>
                    </div>
                </div>
            </div>

            <div class="tagline-container">
                <a id="greetingTagline" class="nav-tagline" href="https://www.youtube.com/watch?v=V9y-11FIGVs" target="_blank" rel="noopener noreferrer">Xin Chào Gayer !</a>
            </div>

            <div class="nav-right">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Tìm kiếm phim..." autocomplete="off">
                    <i class="fas fa-search"></i>
                    <div class="search-suggestions" id="searchSuggestions"></div>
                </div>
                <button id="themeToggle" class="theme-toggle" aria-label="Đổi giao diện">
                    <i class="fas fa-sun"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="heroSection">
        <div class="hero-backdrop" id="heroBackdrop"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title" id="heroTitle"></h1>
            <div class="hero-tags" id="heroTags" style="margin-bottom: 1rem;">
                <!-- Tags -->
            </div>
            <p class="hero-desc" id="heroDesc"></p>
            <a href="#" class="btn btn-primary" id="heroPlayBtn">
                <i class="fas fa-play"></i> Xem Ngay
            </a>
        </div>
    </section>

    <!-- Movies Grid Section -->
    <section class="section">
        <div class="section-header">
            <h2 class="section-title">Phim Mới Cập Nhật</h2>
        </div>

        <div class="loader" id="moviesLoader"></div>

        <div class="movie-grid" id="movieGrid">
            <!-- Movie cards will be inserted here by JS -->
        </div>

        <!-- Pagination -->
        <div class="pagination">
            <button class="page-btn" id="prevBtn" disabled><i class="fas fa-chevron-left"></i></button>
            <div class="page-input-wrapper">
                <span>Trang</span>
                <input type="number" id="currentPageInput" class="page-input-inline" min="1" value="1"
                    title="Nhập số trang và nhấn Enter">
                <span id="totalPagesDisplay"></span>
            </div>
            <button class="page-btn" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
        </div>
    </section>

    <!-- Scripts -->
    <script src="assets/js/greeting.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
