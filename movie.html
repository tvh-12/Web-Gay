<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GayPhim</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Roboto:wght@400;700;900&family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Nunito:wght@700;800;900&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="assets/images/favicon.jpg?v=4">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css?v=21">
</head>

<body>
    <!-- Navbar -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo"><img src="assets/images/cute_logo_transparent.png" alt="Gay Phim Logo"></a>

            <div class="nav-menu">
                <a href="index.html?country=han-quoc" class="k-drama-btn">K-Drama <i class="fas fa-heart"></i></a>
                <div class="dropdown">
                    <button class="dropbtn">Thể loại <i class="fas fa-chevron-down"></i></button>
                    <div class="dropdown-content">
                        <a href="index.html?category=phim-bo">Phim Bộ</a>
                        <a href="index.html?category=phim-le">Phim Lẻ</a>
                        <a href="index.html?category=hoat-hinh">Hoạt Hình</a>
                        <a href="index.html?category=hanh-dong">Hành Động</a>
                        <a href="index.html?category=tinh-cam">Tình Cảm</a>
                        <a href="index.html?category=co-trang">Cổ Trang</a>
                        <a href="index.html?category=chien-tranh">Chiến Tranh</a>
                        <a href="index.html?category=vien-tuong">Viễn Tưởng</a>
                        <a href="index.html?category=kinh-di">Kinh Dị</a>
                        <a href="index.html?category=tam-ly">Tâm Lý</a>
                        <a href="index.html?category=hai-huoc">Hài Hước</a>
                        <a href="index.html?category=vo-thuat">Võ Thuật</a>
                        <a href="index.html?category=khoa-hoc">Khoa Học</a>
                        <a href="index.html?category=than-thoai">Thần Thoại</a>
                    </div>
                </div>
            </div>

            <div class="tagline-container">
                <a id="greetingTagline" class="nav-tagline" href="https://www.youtube.com/watch?v=V9y-11FIGVs" target="_blank" rel="noopener noreferrer">Xin Chào Gayer !</a>
            </div>

            <div class="nav-right">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Tìm kiếm phim..." autocomplete="off">
                    <i class="fas fa-search"></i>
                    <div class="search-suggestions" id="searchSuggestions"></div>
                </div>
                <button id="themeToggle" class="theme-toggle" aria-label="Đổi giao diện">
                    <i class="fas fa-sun"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="loader active" id="movieLoader" style="margin-top: 150px;"></div>

    <div id="movieContent" style="display: none;">
        <!-- Movie Player Section -->
        <section class="movie-player-section">
            <div class="player-container">
                <video id="videoPlayer" class="plyr" playsinline controls crossorigin></video>
            </div>
        </section>

        <!-- Episode Selection Section -->
        <section class="movie-episode-section">
            <div class="server-list" id="serverContainer">
                <h3>Chọn Tập Phim</h3>
                <div id="episodesWrapper">
                    <!-- Server & Episodes injected here -->
                </div>
            </div>
        </section>

        <!-- Movie Detail -->
        <section class="movie-detail-hero">
            <div class="hero-backdrop" id="detailBackdrop"></div>
            <div class="hero-overlay"></div>

            <div class="movie-detail-container">
                <img src="" alt="Poster" class="movie-detail-poster" id="detailPoster">

                <div class="movie-detail-info">
                    <h1 class="hero-title" id="detailTitle"></h1>
                    <h3 style="color: var(--text-secondary); margin-bottom: 1rem; font-weight: 400" id="detailOriginalTitle"></h3>
                    <div class="hero-tags" id="detailTags" style="margin-bottom: 1.5rem;">
                        <!-- Tags will be injected here -->
                    </div>

                    <p class="hero-desc" style="-webkit-line-clamp: unset; line-clamp: unset;" id="detailDesc"></p>

                    <div class="movie-detail-meta" style="margin-bottom: 2rem;">
                        <p><strong>Năm phát hành:</strong> <span id="detailYear"></span></p>
                        <p><strong>Thời lượng:</strong> <span id="detailTime"></span></p>
                        <p><strong>Chất lượng:</strong> <span id="detailQuality"></span></p>
                        <p><strong>Quốc gia:</strong> <span id="detailCountry"></span></p>
                        <p><strong>Đạo diễn:</strong> <span id="detailDirector"></span></p>
                        <p><strong>Diễn viên:</strong> <span id="detailActors"></span></p>
                    </div>

                </div>
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="assets/js/greeting.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/movie.js"></script>
</body>

</html>
